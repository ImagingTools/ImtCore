<!-- Reset filters: the funnel of Filter.svg with a stroke through it.

     A cross tucked into the corner was tried twice and enlarged twice, and it
     kept coming out as a dark blob. The reason is the shape, not the size: an X
     needs arms two or three times longer than the bar is thick to read as an X,
     and a badge that has to fit beside a funnel has no room for them. At the
     twenty-four pixels this renders at, the arms were about three pixels past a
     four-pixel middle, which anti-aliasing simply fills in.

     A single bar across the whole icon has no such threshold - it is one
     straight shape spanning corner to corner, and it says "off" at any size.
     The funnel is back at full scale, so it is the very same drawing as the
     show/hide button it sits next to.

     Fills are declared as attributes, not inside style="...", or the theme pass
     cannot recolour them and the icon renders in its template grey. -->
